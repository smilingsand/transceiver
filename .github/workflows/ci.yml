name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/transceiver

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/transceiver/package-lock.json

      - name: Install Codex CLI
        env:
          CODEX_INSTALL_DIR: ${{ runner.temp }}/codex-bin
          CODEX_NON_INTERACTIVE: "1"
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          echo "$CODEX_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Verify committed reverse bridge
        run: |
          git status --short -- dist/reverse-bridge
          test -z "$(git status --porcelain -- dist/reverse-bridge)"

      - name: Check plugin package
        run: npm pack --dry-run
